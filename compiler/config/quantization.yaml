paths:
  checkpoint: ../models/LocateAnything-3B
  calibration_data: ../datasets/calibration/locateanything/source
  # Use a new last-level directory for each normal build. Reuse an existing
  # directory only with --resume.
  output_dir: ../outputs/chunk1024_cache4096_w8

outputs:
  # Final deployable files. Prefill is a graph inside language_hbm, not a
  # separate HBM file; its BC/HBO intermediates use the language HBM stem.
  vision_hbm: LocateAnything-3B_vision.hbm
  language_hbm: LocateAnything-3B_language.hbm
  embedding_bin: LocateAnything-3B_embed_tokens.bin

calibration:
  # The supplied dataset is used in full. Use a smaller source dataset when
  # developing a faster experiment, or pass --max-samples for a one-off run.
  slow_samples: 128
  max_new_tokens: 1024
  seed: 20260729
  prepare_dtype: bfloat16
  statistics_dtype: float16
  # Optional distribution diagnostics; build scales do not depend on them.
  detailed_statistics: false

language:
  # Stable S600 contract: 1024 Prefill positions, 4096 KV positions, and
  # Host-side token sampling. Sampling policy belongs to the runtime config.
  chunk_size: 1024
  cache_len: 4096

quantization:
  vision_weight_bits: 8
  language_weight_bits: 8
  lm_head_weight_bits: 8

build:
  march: nash-p
  device: cuda:0
  jobs: 16
  cores:
    vision: 4
    prefill: 4
    pbd: 4
    ar: 4
